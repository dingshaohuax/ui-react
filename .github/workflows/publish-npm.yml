name: 发布 npm 组件包

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: 发布 @dingshaohuax/ui-react
    if: github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 检出标签对应的代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 配置 Node.js 和 npm 仓库
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: 校验组件包名称和版本标签
        working-directory: packages/core
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const releaseTag = /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/;

          if (name !== '@dingshaohuax/ui-react') {
            console.error(`组件包名称应为 @dingshaohuax/ui-react，当前为 ${name}`);
            process.exit(1);
          }

          if (!releaseTag.test(tag) || tag !== `v${version}`) {
            console.error(`标签 ${tag} 必须采用 vX.Y.Z 格式并与组件包版本 ${version} 一致`);
            process.exit(1);
          }

          console.log(`${name}@${version} 版本校验通过`);
          NODE
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile
      - name: 构建组件库
        run: pnpm build
      - name: 检查 npm 打包清单
        working-directory: packages/core
        run: npm pack --dry-run
      - name: 发布组件包到 npm
        working-directory: packages/core
        run: npm publish
