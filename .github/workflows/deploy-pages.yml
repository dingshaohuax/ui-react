name: 发布文档和演示到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
      - name: 读取 GitHub Pages 配置
        uses: actions/configure-pages@v6
        id: pages
      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile
      - name: 构建组件库、文档和演示
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          pnpm build
          pnpm -F doc build
      - name: 检查文档和演示入口
        run: |
          test -f apps/doc/dist/index.html
          test -f apps/doc/dist/playground/index.html
      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/doc/dist

  deploy:
    name: 发布站点
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
